services:
  mysql:
    image: mysql:8.0
    container_name: agrislot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agrislot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/lab10_procedures_triggers.sql:/docker-entrypoint-initdb.d/03_lab10.sql
      - ./database/lab11_queries_views_indexes.sql:/docker-entrypoint-initdb.d/04_lab11.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrislot-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: agrislot
      JWT_SECRET: agrislot_docker_jwt_production_secret_key_32chars
    depends_on:
      - mysql

volumes:
  mysql_data:
